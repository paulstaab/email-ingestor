[package]
name = "email-ingestor"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Bounded IMAP to SMTP forwarding with source-only recovery"

[dependencies]
tokio = { version = "=1.53.2", features = ["full", "test-util"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "=2.2.0"
webpki-roots = "=1.0.9"
base64 = "=0.23.1"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json", "env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
